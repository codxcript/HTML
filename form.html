<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio site</title>
    <link rel="icon" type="image/x-icon" href="./Img/YT.jpg">
</head>
<body background="./Img/bg.jpg">
    <h1 align="center">Input Form</h1>
    <table align="center" width="700px">
    <tr><td>
        <form action="">
            <label for="name"><b>First Name:</b></label>
            <input id="name" name="name" placeholder="type your first name" type="text">
            <label for="last"><b>Last Name:</b></label>
            <input id="last" name="last" type="text" placeholder="type your last name">
            <br><br>
            <label for="user"><b>Username:</b></label>
            <input size="21" type="text" name="username" id="user" placeholder="type your username">
            
            <label for="email"><b>Email:</b></label>
            <input size="25" type="email" name="email" placeholder="type your email address" id="email"><br><br>

            <label for="pass"><b>Password:</b></label>
            <input size="22" type="password" name="password" id="pass" placeholder="password"><br><br>

            <label for="date"><b>Date Of Birth:</b></label>
            <input id="date" name="date" type="date"><br><br>

            <b style="margin-right: 12px;">Select Your Gender:</b>
            <input id="male" name="gender" type="radio">&nbsp
            <label for="male"><b>Male</b></label><br>
            <b style="margin-left: 155px;">
            <input id="female" name="gender" type="radio">&nbsp<label for="female">Female</label></b><br>

            <b style="margin-right: 5px;">Religeon:</b><input type="radio" id="muslim" name="religeon">
            <label for="muslim"><b>Muslim</b></label> &nbsp;<input type="radio" name="religeon" id="other">
            <label for="other"><b>Others</b></label><br><br>

            <label for="department"><b>Select Department:</b></label>
            <select name="department" id="department">
                <option value="cse">CSE</option>
                <option value="eee">EEE</option>
                <option value="ncu">NCU</option>
                <option value="ece">ECE</option>
                <option value="ipe">IPE</option>

            </select>

            <br><br>
            <label for="skills"><b>Select Skills:</b></label>
            <select name="skills" id="skills">
                <option value="html">HTML</option>
                <option value="css">CSS</option>
                <option value="js">JavaScript</option>
                <option value="react">React</option>
                <option value="vue">NextJs</option>
                <option value="angular">MongoDB</option>

            </select>
            <br><br>
            <b style="margin-right: 12px;">IT Experience:</b>
            <input type="checkbox" id="1">
            <label for="1"><b>Hardware Expert</b></label><b style="margin-left: 50px;"><input type="checkbox" id="2">
            <label for="2">Software Expert</label></b><br>
            <b style="margin-left: 118px;"><input type="checkbox" id="3">
            <label for="3"><b>Web Development</b></label></b><b style="margin-left: 45px;"><input type="checkbox" id="4">
            <label for="4"><b>Networking</b></label></b><br><b style="margin-left: 118px;"><input type="checkbox" id="5">
            <label for="5"><b>AI/ML</b><b style="margin-left: 122px"><input type="checkbox" name="6" id="6">
            <label for="6">DevOps</label></b><br>
            <br>
            <label style="margin-right: 5px;" for="img">Image & Signature:</label>
            <input type="file" id="img"><br><br>

            <input style="margin-left: 20px;" type="reset" id="reset">
            <input style="margin-left: 10px;" type="submit" id="submit">

        </td></tr>   
    </form>   
    </table>
</body>
</html>

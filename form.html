<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Form</title>
    <link rel="icon" type="image/x-icon" href="./Img/YT.jpg">
</head>
<body background="./Img/bg.jpg">
    <h1 align="center">Input Form</h1>
    
    <form action="/register" method="post" autocomplete="on" enctype="multipart/form-data">
      <b>Professional Registration :</b>
      <fieldset>
        <legend>Account Information</legend>
        <label for="Username">Username</label>
        <input type="text" name="username" id="Username" placeholder="Enter Your Username" autocomplete="username" minlength="4" maxlength="20" required/><br /><br />
        <label for="E-mail">Email</label>
        <input type="email" name="email" id="E-mail" placeholder="Enter your Email" autocomplete="email" minlength="6" maxlength="20" required/><br /><br />
        <label for="PASSWORD">Password</label>
        <input type="password" name="password" id="PASSWORD" placeholder="Enter Your Pasword" autocomplete="password" required/><br /><br />
        <label for="ConfirmPassword">Confirm Password</label>
        <input type="password" name="ConfirmPassword" id="ConfirmPassword" placeholder="Enter Confirm Password" autocomplete="new-password" required/>

      </fieldset>
      <fieldset>
        <legend>Personal Information</legend>
        <label for="FullName">Full Name</label>
        <input type="text" name="fullname" id="FullName" placeholder="Enter Your Name Here" minlength="4" maxlength="20" autocomplete="name" required/><br /><br />
        <label for="dateOfBirth">Date Of Birth</label>
        <input type="date" name="dateOfBirth" id="dateOfBirth" required/><br /><br />
        <span>Gender:</span>

        <input
            type="radio"
            id="male"
            name="gender"
            value="male"
        >
        <label for="male">Male</label>

        <input
            type="radio"
            id="female"
            name="gender"
            value="female"
        >
        <label for="female">Female</label><br /><br />
        <label for="Country">Country</label>
        <select name="Country" id="Country">
          <option value="Bangladesh" selected>Bangladesh</option>
          <option value="India">India</option>
          <option value="Pakistan">Pakistan</option>
          <option value="Australia">Australia</option>
        </select>
      </fieldset>
      <fieldset>
        <legend>Skills</legend>
        <input type="checkbox" name="html" id="html" value="html"/>
        <label for="html">HTML</label>
        <input type="checkbox" name="css" id="css" value="css"/>
        <label for="css">CSS</label>
        <input type="checkbox" name="js" id="js" value="javascript"/>
        <label for="js">JavaScript</label>
        <input type="checkbox" name="react" id="react" value="react"/>
        <label for="react">React</label>
      </fieldset>
      <fieldset>
        <legend>Experience</legend>
        <input type="radio" name="experience" id="Beginner" value="beginner" checked/>
        <label for="Beginner">Beginner</label>
        <input type="radio" name="experience" id="Intermediate" value="intermediate"/>
        <label for="Intermediate">Intermediate</label>
        <input type="radio" name="experience" id="Advance" value="advance"/>
        <label for="Advance">Advance</label>
      </fieldset>
      <fieldset>
        <legend>About</legend>
        <textarea name="about" id="about" rows="8" cols="80" placeholder="Write about yourself.." autocomplete="about"></textarea>
      </fieldset>
      <fieldset>
        <legend>Profile Image</legend>
        <label for="File">Upload Image</label>
        <input type="file" name="file" id="File" accept="image/png, image/jpeg" multiple />
      </fieldset>
      <fieldset>
        <legend>Submit</legend>
        <button type="reset">Reset</button>
        <button type="submit">Create Account</button>
      </fieldset>
    </form>
    <br /><br />
    <b>Form Types :</b>
    <form action="/register" method="post" accept-charset="utf-8">
      <fieldset>
        <legend>Regitration Form</legend>
        <label for="FullName">Full Name</label>
        <input type="text" name="fullname" id="FullName" placeholder="Enter Your Name Here" required/>
        <br /><br />
        <label for="Email">Email</label>
        <input type="email" name="email" id="Email" placeholder="Enter Your Email" required/>
        <br /><br />
        <label for="Password">Password</label>
        <input type="password" name="password" id="Password" placeholder="Enter Your Password" autocomplete="new-password" required/><br /><br />
        <label for="Age">Age</label>
        <input type="number" name="age" id="Age" placeholder="Enter Your Age" min="18" max="80" inputmode="numeric" required />
        <label for="DateOfBirth">Date Of Birth</label>
        <input type="date" name="birthDate" id="DateOfBirth" disabled/><br /><br />
        <label for="Gender">Gender</label>
        <input type="radio" name="Gender" id="Male" value="male" /><label for="Male">Male</label>
        <input type="radio" name="Gender" id="Female" value="female"/><label for="Female">Female</label>
        <br /><br />
        <label for="skills">Skills</label>
        <input type="checkbox" name="skills" id="HTML" value="html" /><label for="HTML">HTML</label>
        <input type="checkbox" name="skills" id="CSS" value="css" /><label for="CSS">CSS</label>
        <input type="checkbox" name="skills" id="JavaScript" value="javascript"/><label for="JavaScript">JavaScript</label>
        <br /><br />
        <label for="Country">Country</label>
        <select name="Country" id="Country">
          <option value="Bangladesh" selected>Bangladesh</option>
          <option value="India">India</option>
          <option value="Pakistan">Pakistan</option>       
        </select><br /><br />
        <button type="reset">Reset</button>
        <button type="submit">Register</button>
      </fieldset>
      <br />
    </form>
    <form action="/register" method="post" autocomplete="on">
      <fieldset>
        <legend>Contact Form</legend>
        <label for="Name">Name</label>
        <input type="text" name="name" id="Name" placeholder="Enter Your Name" autocomplete="name" minlength="4" maxlength="20" required/>
        <br /><br />
        <label for="EMAIL">Email</label>
        <input type="email" name="email" id="EMAIL" placeholder="Enter Your Email" autocomplete="email" minlength="4" maxlength="20" required/><br /><br />
        <label for="Subject">Subject</label>
        <input type="text" name="subject" id="Subject" placeholder="Greetings" autocomplete="subject" readonly><br /><br />
        <label for="Message">Message</label><br /><textarea name="Message" id=Message rows="7" cols="70" placeholder="Send Message" minlength="10" maxlength="200"></textarea>
        <br /><br /><button type="reset">Reset</button>
        <button type="submit">Submit</button>
      </fieldset>
      <br />
    </form>
    <form action="/register" method="post" autocomplete="on">
      <fieldset>
        <legend>Login Form</legend>
        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="Enter Your Email" autocomplete="email" required/>
        
        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Enter Your Password" autocomplete="current-password" pattern="[A-Za-z0-9]+" required/>
        <button type="reset">Reset</button>
        <button type="submit">Login</button>
      </fieldset>
    </form><br />
    <form action="/upload" method="post" enctype="multipart/form-data" accept-charset="utf-8">
      <fieldset>
        <legend>Upload Form</legend>
        <label for="profileImage">Profile Image</label>
        <input type="file" name="profileImage" id="profileImage" accept="image/*" multiple required>
        <button type="submit">Upload</button>
      </fieldset>
    </form><br />
    <form action="/search" method="get" accept-charset="utf-8">
      <fieldset>
        <legend>Search Form</legend>
        <label for="search">Search</label>
        <input type="text" name="search" id="search" maxlength="50" placeholder="Search Something.."/>
        <button type="submit">Search</button>
      </fieldset>
    </form>
    <br /><br />
    <b>Extra :</b>
    <form action="/register" method="post" autocomplete="on">
            <label for="name">First Name</label>
            <input id="name" name="name" placeholder="Enter Your First Name" type="text" maxlength="20" required>
            <label for="last">Last Name</label>
            <input id="last" name="last" type="text" placeholder="Enter Your Last Name" maxlength="20" required>
            <br><br>
            <label for="user">Username</label>
            <input size="21" type="text" name="username" id="user" placeholder="Enter Your Username" autocomplete="username" maxlength="20" required>
            
            <label for="email">Email</label>
            <input size="25" type="email" name="email" placeholder="Enter Your Email" id="email" autocomplete="email" maxlength="50" inputmode="email" multiple required><br><br>

            <label for="pass">Password</label>
            <input size="22" type="password" name="password" id="pass" placeholder="Enter Password" minlength="8" autocomplete="new-password" required><br><br>

            <label for="date">Date Of Birth</label>
            <input id="date" name="date" type="date"><br><br>

            <label for="Gender">Gender</label>
            <input id="male" name="gender" type="radio" value="male" checked>
            <label for="male">Male</label>
            <input id="female" name="gender" type="radio" value="female">&nbsp<label for="female">Female</label><br>
            <br />
            <label for="Religeon">Religeon</label>
            <input type="radio" id="muslim" name="religeon" value="muslim" checked>
            <label for="muslim">Muslim</label> &nbsp;<input type="radio" name="religeon" id="other" value="others">
            <label for="other">Others</label><br><br>

            <label for="department">Select Department</label>
            <select name="department" id="department">
                <option value="cse" selected>CSE</option>
                <option value="eee">EEE</option>
                <option value="ncu">NCU</option>
                <option value="ece">ECE</option>

            </select>

            <br><br />
            <label for="skills">Choose Experience</label>
            <input name="skills" id="skills" list="skill" />
            <datalist id="skill" >
                <option value="Hardware Expert">
                <option value="Software Development">
                <option value="Web Development">
                <option value="App Development">
                <option value="Networking">
                <option value="AI/Machine Learning">
                <option value="DevOps">
            </datalist>
            <br>
            <br>
            <label for="gpa">GPA </label>
            <input type="number" name="gpa" id="gpa" min="0" max="5" step="0.1"/>
            
            <label for="color">Pick a Color</label>
            <input type="color" name="color" id="color"/>
            <br /><br />
            <label for="volume">Volume </label>
            <input type="range" name="volume" id="volume" min="0" max="100" value="10"/><input type="hidden" name="userId" value="12345" />
            <br /><br />
            <label for="Website">Website</label>
            <input type="url" name="Website" id="Website" placeholder="https://www.example.com" />
            <br /><br />
            <label for="Phone">Phone</label>
            <input type="tel" name="Phone" id="Phone" autocomplete="tel" />
            <br /><br />
            <label for="search">Search</label>
            <input type="search" name="search" id="search" /><br /><br />
            <label for="meeting">Consult Time</label>
            <input type="datetime-local" name="meeting" id="meeting" />
            <br><br />
            <label style="margin-right: 5px;" for="img">Image & Signature:</label>
            <input type="file" id="img" accept=".pdf" multiple><br><br>

            <input type="reset" id="reset">
            <input type="submit" id="submit">
 
    </form>   
  
</body>
</html>
